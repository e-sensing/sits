#
# HuggingFace (HF) datasets.
#
# HuggingFace is not an image catalogue: it hosts dataset repositories. Each
# repository describes its own collection in a "sits/sits.yml" file, which
# sits reads and registers on demand as the source "HF:<user>" with the
# collection "<repository>".
#
# For this reason, there is no "sources" entry here: collections are not known
# in advance. The parameters below define how to reach HuggingFace and which
# collection properties are assumed when a repository does not declare them.
#

# Note: Sources and collections are registered in upper case, as sits does with
# its own sources, and mapped back to their repository by searching the datasets
# of the user (HuggingFace names are case sensitive). Names written in image
# files (satellite, sensor) can't hold the delimiter of the file names used in sits,
# so their invalid characters are replaced.
hf:
    source_prefix : "HF:"
    url           : "https://huggingface.co/datasets"
    api_url       : "https://huggingface.co/api/datasets"
    search_limit  : 1000
    config_file   : "sits.yml"

    # Note: files written by sits to describe a dataset (e.g., "sits.yml",
    # "cache.rds") are kept in their own directory of the repository, so they
    # are not mixed with the other files of the dataset.
    sits_dir      : "sits"
    file_path     : "resolve/main"

    # Note: HuggingFace hosts datasets and models in repositories of different
    # types, each one reached in its own address. Cubes are always shared in
    # datasets, while samples and models can be shared in both.
    base_url      : "https://huggingface.co/"
    repo_types:
        dataset:
            url     : "https://huggingface.co/datasets"
            api_url : "https://huggingface.co/api/datasets"
        
        model:
            url     : "https://huggingface.co"
            api_url : "https://huggingface.co/api/models"
    
    cube_repo_type : "dataset"

    # Note: samples and models are shared as files read by sits (e.g.,
    # written by saveRDS() or sits_to_parquet()).
    files_extensions : ["rds", "parquet"]

    # Note: HuggingFace limits the number of files requested in a window of
    # time. The remaining requests are informed in the headers of each
    # response ("<bucket>";r=<remaining>;t=<seconds to reset>). A margin of the
    # remaining requests is kept to retry downloads that fail.
    rate_limit_header : "ratelimit"
    rate_limit_margin : 0.1
    rate_limit_regex  : "r=([0-9]+);t=([0-9]+)"

    # Note: GDAL opens a remote image by searching for auxiliary files (e.g.,
    # ".aux.xml", ".ovr") that datasets don't share. Each search is a request
    # counted by HuggingFace, so they are disabled while a cube is loaded.
    gdal_env:
        GDAL_DISABLE_READDIR_ON_OPEN     : "EMPTY_DIR"
        CPL_VSIL_CURL_ALLOWED_EXTENSIONS : ".tiff,.tif,.jp2,.hdf,.vrt,.gpkg"

    name_invalid_chars : "[^A-Z0-9-]"
    name_separator     : "-"

    # Note: HuggingFace signs requests with a personal access token, which
    # raises the request limits of an account and is required to read a
    # private dataset. The token is read from the environment, as HuggingFace
    # itself reads it.
    token_env       : ["HF_TOKEN", "HUGGING_FACE_HUB_TOKEN"]
    token_url       : "https://huggingface.co/api/whoami-v2"
    token_header    : "Authorization"
    token_type      : "Bearer"
    token_gdal_env  : "GDAL_HTTP_HEADER_FILE"

    # Note: a dataset can share a data cube prepared by its provider, which
    # sits reads instead of reading files of the repository.
    cache_file       : "cache.rds"
    cache_keys       : ["sits_version", "created", "source", "collection", "cube"]

    s3_class         : ["hf_cube", "stac_cube", "eo_cube", "raster_cube"]

    collection_defaults:
        grid_system     : "NoTilingSystem"
        metadata_search : "tile"
        ext_tolerance   : 0
        open_data       : true
        open_data_token : false
        delim           : "_"
        parse_info      : ["X1", "X2", "tile", "band", "date"]

    # Note: A collection definition written by sits describes the data shared in
    # a dataset. The keys below describe how sits reaches a provider, not the
    # data, so they are not written in the HuggingFace definition file
    # (sits defines them when it registers a dataset)
    collection_conf_source_keys : ["s3_class", "service", "url",
                                   "collection_name", "open_data",
                                   "open_data_token", "access_vars",
                                   "token_vars", "item_type", "platforms",
                                   "orbits", "tile_required", "hls_cube",
                                   "review_dates", "metadata_search"]

    # Date configuration
    collection_conf_dates_sep   : " to "

    # Order of the keys
    collection_conf_key_order   : ["satellite", "sensor", "grid_system",
                                   "dates", "class_cube", "labels", "bands"]

    # Origin
    collection_conf_origin      : "# Written by sits from %s."

    # Header
    collection_conf_header:
        - "# sits collection definition of a HuggingFace dataset."
        - "#"
        - "# Place this file in the 'sits' directory of the dataset repository,"
        - "# naming the images as sits names them, and open the dataset with:"
        - "#"
        - "#     sits_from_hf("
        - "#         repo       = \"<user>/<repository>\","
        - "#         output_dir = \"<directory>\""
        - "#     )"
        - "#"
        - "# Declare only the bands shared in the dataset."
