# Example of a sits collection definition for a HuggingFace dataset.
#
# To share a data cube on HuggingFace, store the images in a dataset
# repository, naming them "<satellite>_<sensor>_<tile>_<band>_<date>.<ext>"
# (the convention used for local data cubes), and place a file named
# "sits.yml" at the root of the repository, describing the collection as
# below. HuggingFace names are converted to sits names (upper case, with
# characters other than letters, digits and "-" replaced by "-"); the same
# conversion applies to the satellite and sensor names, which are part of the
# names of files written by sits. The cube is then opened with:
#
#     sits_cube(
#         source     = "HF:<user>",
#         collection = "<repository>",
#         tiles      = "<tile>"
#     )
#
# Datasets can hold data cubes of images (as in this example), embeddings,
# or classified maps:
#   - embeddings: images named after the bands sits uses for embeddings
#     ("EMB00", "EMB01", ...). sits defines how embeddings are stored, so
#     these datasets describe no bands at all: how many of them the dataset
#     holds is taken from the names of its images, and their resolution from
#     the images. A dataset that describes its embedding bands must follow
#     the sits definition (see embedding_values in the sits configuration);
#   - classified maps: "class_cube: true" and a single band named "CLASS",
#     whose "values" associate each pixel value to a label;
#   - results produced by sits (e.g., probabilities, classified maps,
#     uncertainty), keeping the file names written by sits
#     ("<satellite>_<sensor>_<tile>_<start_date>_<end_date>_<band>_<version>"
#     followed by the file extension).
#     Their bands follow the sits definition of results, so each band only
#     informs its resolution, and the labels are declared once:
#
#         labels:
#             1: "Cerrado"
#             2: "Forest"
#         bands:
#             PROBS : &band
#                 resolution: 231.656
#             CLASS : *band
#
#     Results are loaded one band at a time (e.g., bands = "probs").
#
# This example describes the dataset "felipemcarlos/sits_mod13q1_sinop", a
# small crop (255 x 147 pixels) of the MOD13Q1 NDVI product over Sinop
# (Mato Grosso, Brazil), distributed with sits as example data.

satellite   : "TERRA"
sensor      : "MODIS"
# tiling system of the images. With a grid known to sits (e.g. "MGRS",
# "BDC_MD_V2"), only the tiles that intersect a roi are read; otherwise use
# a label (as sits does for other products, e.g. "STG", "WRS-2",
# "NoTilingSystem")
grid_system : "STG"
dates       : "2013 to 2014"

bands:
    NDVI:
        missing_value : -3000
        minimum_value : -2000
        maximum_value : 10000
        scale_factor  : 0.0001
        offset_value  : 0
        resolution    : 231.656
        band_name     : "NDVI"
        data_type     : "INT2S"
